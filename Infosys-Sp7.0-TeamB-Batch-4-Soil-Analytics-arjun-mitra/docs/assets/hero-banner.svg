<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="AgriSync: Smarter Soil. Better Decisions. Sustainable Agriculture." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10291D"/><stop offset=".6" stop-color="#1F4A32"/><stop offset="1" stop-color="#365A3C"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#F3E6B3" stop-opacity=".95"/><stop offset=".45" stop-color="#C5D9A4" stop-opacity=".35"/><stop offset="1" stop-color="#C5D9A4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C7A45"/><stop offset="1" stop-color="#2A4A2C"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A5535"/><stop offset="1" stop-color="#3E2A18"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="440" rx="30"/></clipPath>
    <style>
      .brand{font:700 92px Georgia,'Times New Roman',serif;fill:#FBF8EC}
      .chip{font:600 13px 'Segoe UI',Arial,sans-serif;letter-spacing:3px;fill:#E9E1D0}
      .t{font:italic 28px Georgia,serif;fill:#DDEBC3;opacity:0}
      .t1{animation:cyc 9s ease-in-out infinite}
      .t2{animation:cyc 9s ease-in-out infinite 1.2s}
      .t3{animation:cyc 9s ease-in-out infinite 2.4s}
      .sub{font:600 13px 'Segoe UI',Arial,sans-serif;letter-spacing:3px;fill:#9DB87C}
      .sun{animation:glow 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .row{stroke:#7DB06A;stroke-width:3;stroke-linecap:round;stroke-dasharray:2 14;animation:flow 3s linear infinite}
      .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
      .sway2{animation-delay:-1.3s}.sway3{animation-delay:-2.6s}
      .leaf{animation:drift 7s ease-in-out infinite}.leaf2{animation:drift 9s ease-in-out infinite reverse}
      .star{animation:tw 3s ease-in-out infinite}
      @keyframes cyc{0%{opacity:0;transform:translateY(8px)}12%,70%{opacity:1;transform:none}85%,100%{opacity:1;transform:none}}
      @keyframes glow{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
      @keyframes flow{to{stroke-dashoffset:-32}}
      @keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
      @keyframes drift{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(10px,-16px) rotate(8deg)}}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:.8}}
    </style>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="440" fill="url(#sky)"/>
    <g fill="#FBF8EC"><circle class="star" cx="90" cy="60" r="2"/><circle class="star" cx="300" cy="36" r="1.6" style="animation-delay:.8s"/><circle class="star" cx="560" cy="70" r="2" style="animation-delay:1.6s"/><circle class="star" cx="700" cy="30" r="1.5" style="animation-delay:.4s"/><circle class="star" cx="1100" cy="50" r="2" style="animation-delay:2s"/></g>
    <circle class="sun" cx="930" cy="250" r="190" fill="url(#sun)"/>
    <circle cx="930" cy="250" r="46" fill="#F3E6B3" opacity=".9"/>

    <!-- far hills -->
    <path d="M0 300 Q200 240 420 290 T820 280 T1200 290 V440 H0Z" fill="#2F5A3D" opacity=".8"/>
    <!-- crop field -->
    <path d="M0 330 Q300 300 600 326 T1200 320 V440 H0Z" fill="url(#field)"/>
    <g>
      <path class="row" d="M0 350 Q300 330 600 346 T1200 342"/>
      <path class="row" d="M0 372 Q300 352 600 368 T1200 364" style="animation-duration:2.4s"/>
      <path class="row" d="M0 396 Q300 376 600 392 T1200 388" style="animation-duration:1.9s"/>
      <path class="row" d="M0 422 Q300 402 600 418 T1200 414" style="animation-duration:1.5s"/>
    </g>
    <!-- sprouts -->
    <g transform="translate(930 330)">
      <path d="M-170 70 Q-60 40 0 62 T170 60 V110 H-170Z" fill="url(#soil)"/>
      <g class="sway"><path d="M0 62 C0 30 0 0 0 -48" stroke="#C5D9A4" stroke-width="6" fill="none" stroke-linecap="round"/>
        <path d="M0 -4 C-46 -4 -72 -34 -72 -62 C-36 -66 -4 -42 0 -4Z" fill="#7C9A5E"/>
        <path d="M0 -30 C42 -30 72 -62 72 -92 C34 -94 2 -68 0 -30Z" fill="#C5D9A4"/></g>
      <g class="sway sway2" transform="translate(-90 20)"><path d="M0 40 V-6" stroke="#9DB87C" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M0 4 C-24 4 -38 -12 -38 -28 C-18 -30 -2 -18 0 4Z" fill="#7C9A5E"/></g>
      <g class="sway sway3" transform="translate(95 22)"><path d="M0 38 V-4" stroke="#9DB87C" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M0 2 C24 2 38 -14 38 -30 C18 -32 2 -20 0 2Z" fill="#9DB87C"/></g>
    </g>
    <!-- leaves -->
    <path class="leaf" d="M640 120c16-22 42-20 50-16-4 20-24 36-50 16z" fill="#7C9A5E" opacity=".6"/>
    <path class="leaf2" d="M1090 110c16-22 42-20 50-16-4 20-24 36-50 16z" fill="#C5D9A4" opacity=".5"/>

    <!-- text -->
    <rect x="60" y="56" width="262" height="34" rx="17" fill="#FFFFFF" fill-opacity=".1"/>
    <text class="chip" x="80" y="78">INTELLIGENT AGRICULTURE</text>
    <text class="brand" x="56" y="176">Agri<tspan fill="#C5D9A4" font-style="italic">Sync</tspan></text>
    <text class="t t1" x="60" y="228">Smarter Soil.</text>
    <text class="t t2" x="60" y="266">Better Decisions.</text>
    <text class="t t3" x="60" y="304">Sustainable Agriculture.</text>
    <text class="sub" x="60" y="352">AI-POWERED SOIL ANALYTICS  ·  CROP ADVISORY  ·  FARMER COMMUNITY</text>
  </g>
</svg>
