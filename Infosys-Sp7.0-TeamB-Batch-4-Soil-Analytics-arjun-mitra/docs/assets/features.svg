<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Three core capabilities: Image-Based Analysis, Nutrient Assessment, Intelligent Crop Advisory" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFDF6"/><stop offset="1" stop-color="#F4EEDC"/></linearGradient>
    <style>
      .card{fill:url(#c);stroke:#D8CFB6;stroke-width:1.5}
      .n{font:13px Georgia,serif;fill:#8A8068}
      .h{font:700 24px Georgia,serif;fill:#1A3C2B}
      .d{font:14px 'Segoe UI',Arial,sans-serif;fill:#5C5648}
      .tag{font:600 11px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#365A3C}
      .pl{font:600 10px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#A08560}
      .ic{fill:none;stroke:#365A3C;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .fl{animation:fl 5s ease-in-out infinite}.fl2{animation-delay:.7s}.fl3{animation-delay:1.4s}
      .scan{animation:scan 2.6s ease-in-out infinite}
      .bub{animation:bub 3s ease-in infinite}
      .grow{transform-box:fill-box;transform-origin:50% 100%;animation:gr 3s ease-in-out infinite}
      @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      @keyframes scan{0%,100%{transform:translateY(-8px);opacity:.2}50%{transform:translateY(8px);opacity:1}}
      @keyframes bub{0%{transform:translateY(6px);opacity:0}50%{opacity:1}100%{transform:translateY(-10px);opacity:0}}
      @keyframes gr{0%,100%{transform:scale(.85)}50%{transform:scale(1.1)}}
    </style>
  </defs>
  <g class="fl"><rect class="card" x="20" y="20" width="360" height="290" rx="26"/>
    <text class="n" x="48" y="62">01 / 03</text>
    <rect x="316" y="38" width="46" height="46" rx="14" fill="#E4EADB"/>
    <g transform="translate(339 61)"><rect class="ic" x="-11" y="-11" width="22" height="22" rx="4"/><line class="ic scan" x1="-8" y1="0" x2="8" y2="0"/></g>
    <rect x="48" y="104" width="136" height="26" rx="13" fill="#EDEAE0"/><text class="tag" x="64" y="121">COMPUTER VISION</text>
    <text class="h" x="48" y="172">Image-Based Analysis</text>
    <text class="d" x="48" y="204">Analyze soil images using computer</text><text class="d" x="48" y="226">vision to support soil assessment.</text>
    <text class="pl" x="48" y="282">STATUS · PLANNED</text></g>

  <g class="fl fl2"><rect class="card" x="420" y="20" width="360" height="290" rx="26"/>
    <text class="n" x="448" y="62">02 / 03</text>
    <rect x="716" y="38" width="46" height="46" rx="14" fill="#E4EADB"/>
    <g transform="translate(739 61)"><path class="ic" d="M-5 -13h10M-3 -13v9l-8 15a3 3 0 0 0 3 4h16a3 3 0 0 0 3-4l-8-15v-9"/><circle class="bub" cx="-1" cy="4" r="2" fill="#365A3C"/><circle class="bub" cx="3" cy="6" r="1.5" fill="#365A3C" style="animation-delay:1s"/></g>
    <rect x="448" y="104" width="130" height="26" rx="13" fill="#EDEAE0"/><text class="tag" x="464" y="121">DATA INTELLIGENCE</text>
    <text class="h" x="448" y="172">Nutrient Assessment</text>
    <text class="d" x="448" y="204">Use soil information and nutrient data</text><text class="d" x="448" y="226">to build a clearer soil profile.</text>
    <text class="pl" x="448" y="282">STATUS · PLANNED</text></g>

  <g class="fl fl3"><rect class="card" x="820" y="20" width="360" height="290" rx="26"/>
    <text class="n" x="848" y="62">03 / 03</text>
    <rect x="1116" y="38" width="46" height="46" rx="14" fill="#E4EADB"/>
    <g transform="translate(1139 61)"><g class="grow"><path class="ic" d="M0 12V-2M0 -2C-9 -2 -12 -8 -12 -13c6 0 11 4 12 11zM0 4C8 4 12 -2 12 -7c-6 0-11 4-12 11z"/></g></g>
    <rect x="848" y="104" width="124" height="26" rx="13" fill="#EDEAE0"/><text class="tag" x="864" y="121">DECISION SUPPORT</text>
    <text class="h" x="848" y="172">Intelligent Crop Advisory</text>
    <text class="d" x="848" y="204">Combine soil analysis results to help</text><text class="d" x="848" y="226">identify potentially suitable crops.</text>
    <text class="pl" x="848" y="282">STATUS · PLANNED</text></g>
</svg>
