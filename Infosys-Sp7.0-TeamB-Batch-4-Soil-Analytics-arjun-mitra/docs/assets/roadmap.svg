<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="AgriSync roadmap timeline" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><style>
    .h{font:700 20px Georgia,serif;fill:#1A3C2B}.d{font:13px 'Segoe UI',Arial,sans-serif;fill:#5C5648}
    .p{font:600 11px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#7C9A5E}
    .line{stroke:#CFC6AC;stroke-width:4;stroke-linecap:round}
    .prog{stroke:#365A3C;stroke-width:4;stroke-linecap:round;stroke-dasharray:6 10;animation:f 1.4s linear infinite}
    .dot{fill:#FBF8EC;stroke:#A08560;stroke-width:3}.done{fill:#365A3C;stroke:#365A3C}
    .ping{fill:none;stroke:#365A3C;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
    @keyframes f{to{stroke-dashoffset:-32}}
    @keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.4);opacity:0}}
  </style></defs>
  <rect width="1200" height="260" rx="24" fill="#F4EEDC"/>
  <line class="line" x1="100" y1="90" x2="1100" y2="90"/>
  <line class="prog" x1="100" y1="90" x2="240" y2="90"/>
  <g><circle class="ping" cx="100" cy="90" r="10"/><circle class="dot done" cx="100" cy="90" r="12"/>
    <text class="p" x="60" y="140">NOW</text><text class="h" x="60" y="166">Interface</text><text class="d" x="60" y="192">Landing, auth UI,</text><text class="d" x="60" y="210">community, feedback</text></g>
  <g><circle class="dot" cx="400" cy="90" r="12"/>
    <text class="p" x="360" y="140">NEXT</text><text class="h" x="360" y="166">Verify backend</text><text class="d" x="360" y="192">Document routes, schema,</text><text class="d" x="360" y="210">scripts, and tests</text></g>
  <g><circle class="dot" cx="700" cy="90" r="12"/>
    <text class="p" x="660" y="140">THEN</text><text class="h" x="660" y="166">AI integration</text><text class="d" x="660" y="192">Image + nutrient models,</text><text class="d" x="660" y="210">crop recommendations</text></g>
  <g><circle class="dot" cx="1000" cy="90" r="12"/>
    <text class="p" x="960" y="140">LATER</text><text class="h" x="960" y="166">Reach and scale</text><text class="d" x="960" y="192">Multilingual, voice,</text><text class="d" x="960" y="210">CI/CD, session controls</text></g>
</svg>
