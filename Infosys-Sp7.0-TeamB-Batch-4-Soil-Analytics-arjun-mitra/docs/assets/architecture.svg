<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="AgriSync architecture: User to React frontend to Express API to MySQL, with planned AI services" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF8EC"/><stop offset="1" stop-color="#F1EBDA"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#365A3C"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#A08560"/>
    </marker>
    <style>
      .h  { font: 700 20px Georgia, serif; fill: #1A3C2B; }
      .s  { font: 13px 'Segoe UI', Arial, sans-serif; fill: #5C5648; }
      .lb { font: 600 12px 'Segoe UI', Arial, sans-serif; letter-spacing: 2px; fill: #7C9A5E; }
      .pl { font: 600 11px 'Segoe UI', Arial, sans-serif; letter-spacing: 2px; fill: #A08560; }
      .node { fill: url(#g); stroke: #365A3C; stroke-width: 2; }
      .plan { fill: #FBF8EC; stroke: #A08560; stroke-width: 2; stroke-dasharray: 7 6; }
      .flow { stroke: #365A3C; stroke-width: 2.5; fill: none; stroke-dasharray: 8 8; animation: dash 1.2s linear infinite; }
      .flowp{ stroke: #A08560; stroke-width: 2; fill: none; stroke-dasharray: 3 9; animation: dash 2s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -32; } }
      .bob { animation: bob 4s ease-in-out infinite; }
      @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
    </style>
  </defs>

  <rect width="1200" height="560" rx="24" fill="#E9E1D0"/>
  <text class="lb" x="40" y="48">SYSTEM ARCHITECTURE</text>
  <text class="h" x="40" y="78" style="font-size:26px">AgriSync request flow</text>

  <!-- Row 1 -->
  <g class="bob"><rect class="node" x="40"  y="130" width="220" height="110" rx="20"/>
    <text class="h" x="64" y="175">Farmer</text><text class="s" x="64" y="200">Browser / mobile web</text><text class="s" x="64" y="220">Landing, auth, workspace</text></g>
  <g class="bob" style="animation-delay:.3s"><rect class="node" x="340" y="130" width="240" height="110" rx="20"/>
    <text class="h" x="364" y="175">React + Vite UI</text><text class="s" x="364" y="200">Tailwind CSS, Lucide icons</text><text class="s" x="364" y="220">Visible in screenshots</text></g>
  <g class="bob" style="animation-delay:.6s"><rect class="node" x="660" y="130" width="240" height="110" rx="20"/>
    <text class="h" x="684" y="175">Express API</text><text class="s" x="684" y="200">JWT cookie auth, OTP email</text><text class="s" x="684" y="220">Helmet, CORS, rate limits</text></g>
  <g class="bob" style="animation-delay:.9s"><rect class="node" x="980" y="130" width="190" height="110" rx="20"/>
    <text class="h" x="1004" y="175">MySQL</text><text class="s" x="1004" y="200">users, sessions,</text><text class="s" x="1004" y="220">events, audit logs</text></g>

  <path class="flow" d="M262 185 H336" marker-end="url(#arr)"/>
  <path class="flow" d="M582 185 H656" marker-end="url(#arr)"/>
  <path class="flow" d="M902 185 H976" marker-end="url(#arr)"/>
  <path class="flow" d="M656 215 H582" marker-end="url(#arr)" style="animation-direction:reverse;opacity:.45"/>

  <text class="s" x="270" y="170">HTTPS</text>
  <text class="s" x="590" y="170">REST</text>
  <text class="s" x="912" y="170">SQL</text>

  <!-- cookie return -->
  <path class="flow" d="M780 245 V300 H460 V246" marker-end="url(#arr)" style="opacity:.55"/>
  <text class="s" x="500" y="322">HTTP-only auth cookie returned after password / OTP verification</text>

  <!-- AI row (planned) -->
  <text class="pl" x="40" y="388">PLANNED · NOT VERIFIED AS CONNECTED</text>
  <rect class="plan" x="340" y="410" width="200" height="100" rx="18"/>
  <text class="h" x="360" y="452" style="font-size:17px">Image analysis</text><text class="s" x="360" y="476">Soil photo model</text>
  <rect class="plan" x="570" y="410" width="200" height="100" rx="18"/>
  <text class="h" x="590" y="452" style="font-size:17px">Text analysis</text><text class="s" x="590" y="476">Nutrient data model</text>
  <rect class="plan" x="800" y="410" width="240" height="100" rx="18"/>
  <text class="h" x="820" y="452" style="font-size:17px">Crop advisory engine</text><text class="s" x="820" y="476">Fuses both results</text>

  <path class="flowp" d="M540 460 H566" marker-end="url(#arrp)"/>
  <path class="flowp" d="M770 460 H796" marker-end="url(#arrp)"/>
  <path class="flowp" d="M780 408 V250" marker-end="url(#arrp)"/>
</svg>
